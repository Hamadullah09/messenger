# Prometheus configuration for SMA. Local use: `docker compose --profile monitoring up -d`.
# In production, point the targets at the internal metrics ports of every API and worker
# replica (service discovery) and keep those ports off the public network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sma-api
    static_configs:
      - targets: ['host.docker.internal:9464']
  - job_name: sma-worker
    static_configs:
      - targets: ['host.docker.internal:9465']
