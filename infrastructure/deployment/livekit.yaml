# LiveKit media server for group calls in groups larger than 8 people (profile "livekit").
# API key/secret come from LIVEKIT_KEYS ("<key>: <secret>") in .env.livekit; the same pair
# goes into .env.production as LIVEKIT_API_KEY / LIVEKIT_API_SECRET.
# Open on the firewall: 7881/tcp and 50000-50200/udp (media). 7880 stays on the internal
# network and is reached through Caddy (wss://livekit.<your domain>).
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: true
room:
  empty_timeout: 300
  max_participants: 100
logging:
  level: info
