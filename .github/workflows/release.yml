name: Release

# Tag a release (git tag v1.2.3 && git push --tags) to build, verify and publish images,
# then deploy after a manual approval on the "production" environment.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - { name: sma-api, file: infrastructure/docker/api.Dockerfile, target: runtime }
          - { name: sma-api-migrate, file: infrastructure/docker/api.Dockerfile, target: migrate }
          - { name: sma-web, file: infrastructure/docker/web.Dockerfile, target: runtime }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            NEXT_PUBLIC_REALTIME_URL=${{ vars.PUBLIC_ORIGIN }}
            NEXT_PUBLIC_MEDIA_ORIGIN=${{ vars.MEDIA_ORIGIN }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:sha-${{ github.sha }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: images
    runs-on: ubuntu-latest
    # Requires a reviewer's approval (configure protection rules on the environment).
    environment: production
    concurrency: production-deploy
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ github.ref_name }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          DOMAIN: ${{ vars.SMA_DOMAIN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" \
            "cd /opt/sma && REGISTRY='$REGISTRY' SMA_DOMAIN='$DOMAIN' scripts/ops/deploy.sh '$TAG'"
